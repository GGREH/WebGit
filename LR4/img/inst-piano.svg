  <g fill="none" stroke="#375437" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 45 L90 45 C86 65 80 82 52 82 L30 82 Z" fill="#f6faf4"/>
    <!-- Lid open -->
    <line x1="30" y1="45" x2="68" y2="24" stroke="#375437" stroke-width="2.5"/>
    <line x1="68" y1="24" x2="62" y2="45" stroke="#b6ccb2" stroke-width="1.8"/>
    <!-- Keyboard -->
    <rect x="30" y="74" width="60" height="8" fill="#ffffff" stroke="#375437" stroke-width="1.5"/>
    <line x1="38" y1="74" x2="38" y2="82" stroke="#375437" stroke-width="1"/>
    <line x1="46" y1="74" x2="46" y2="82" stroke="#375437" stroke-width="1"/>
    <line x1="54" y1="74" x2="54" y2="82" stroke="#375437" stroke-width="1"/>
    <line x1="62" y1="74" x2="62" y2="82" stroke="#375437" stroke-width="1"/>
    <line x1="70" y1="74" x2="70" y2="82" stroke="#375437" stroke-width="1"/>
    <line x1="78" y1="74" x2="78" y2="82" stroke="#375437" stroke-width="1"/>
    <line x1="86" y1="74" x2="86" y2="82" stroke="#375437" stroke-width="1"/>
    <!-- Legs -->
    <line x1="34" y1="82" x2="34" y2="96" stroke="#375437" stroke-width="2.5"/>
    <line x1="86" y1="82" x2="86" y2="96" stroke="#375437" stroke-width="2.5"/>
