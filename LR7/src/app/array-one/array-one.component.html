<section class="flex flex-column section-center">
    <div class="content">
        <h2>Завдання — Одновимірні масиви (Варіант 16)</h2>
        <p>
            Сформуйте лінійний масив дійсних чисел, елементи якого є відстанями,
            пройденими тілом при вільному падінні на землю за 1, 2, ..., 10 с
            (формула: s = g · t² / 2).
        </p>
    </div>

    <div class="flex flex-row flex-wrap form-inputs">
        <div class="flex flex-column input-group">
            <label for="nInput">Кількість секунд (N):</label>
            <input id="nInput" type="number" min="1" max="100" step="1" value="10" placeholder="Введіть N" #nInput />
        </div>

        <div class="flex flex-column input-group">
            <label for="gInput">Прискорення g (м/с²):</label>
            <input id="gInput" type="number" min="0.1" max="100" step="0.01" value="9.81" placeholder="Введіть g" #gInput />
        </div>

        <button class="btn" (click)="calculate(nInput.value, gInput.value)">
            <span>Розрахунок</span>
        </button>
    </div>

    <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="flex flex-column results-box" *ngIf="arrayOne.a.length > 0">
        <h2>Одновимірний масив відстаней (м)</h2>
        <div class="flex flex-row flex-wrap array-list">
            <div class="array-item" *ngFor="let item of arrayOne.a; index as i">
                <span>t = {{ i + 1 }} с:</span> <strong>{{ item }} м</strong>
            </div>
        </div>
    </div>
</section>
